name = "atlas-cache-proxy"
main = "src/index.js"
compatibility_date = "2024-09-23"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# How long cached entries stay fresh, in seconds. 300 = 5 minutes.
CACHE_TTL_SECONDS = "300"

# Set as secrets (not committed):
#   wrangler secret put SUPABASE_URL
#   wrangler secret put SUPABASE_SERVICE_KEY
